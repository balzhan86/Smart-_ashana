<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART ASХАНА</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#1664c0;color:white;padding:22px;text-align:center}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;padding:15px;max-width:850px;margin:auto}.card,.cart{background:white;padding:20px;border-radius:18px;box-shadow:0 3px 12px #0002}.cart{margin:15px auto;max-width:810px}button{background:#1664c0;color:white;border:0;padding:12px 18px;border-radius:10px;font-weight:bold}#items div{padding:8px;border-bottom:1px solid #ddd}</style></head><body><header><h1>🍽️ SMART ASХАНА</h1><p>Мектеп асханасы</p></header><h2 style="text-align:center">Бүгінгі мәзір</h2><div class="menu" id="menu"></div><div class="cart"><h2>🛒 Менің тапсырысым</h2><div id="items">Әзірге тағам таңдалған жоқ.</div><h3>Жалпы: <span id="sum">0</span> тг</h3><button onclick="order()">Тапсырыс беру</button></div><script>let a=[];let f=[["🍲","Сорпа",500],["🍗","Котлет + гарнир",800],["🥗","Салат",300],["🥤","Сусын",250]];menu.innerHTML=f.map((x,i)=>`<div class="card"><div style="font-size:42px">${x[0]}</div><h3>${x[1]}</h3><p><b>${x[2]} тг</b></p><button onclick="add(${i})">Таңдау</button></div>`).join("");function add(i){a.push(i);show()}function show(){let s=0;items.innerHTML=a.length?a.map(i=>{s+=f[i][2];return `<div>${f[i][0]} ${f[i][1]} — ${f[i][2]} тг</div>`}).join(""):"Әзірге тағам таңдалған жоқ.";sum.textContent=s}function order(){if(!a.length)return alert("Алдымен тағам таңдаңыз.");alert("Тапсырысыңызға рахмет!\nТапсырыс қабылданды.");}</script></body></html>
